name: Build EditVerse IPA

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-14
    timeout-minutes: 45

    env:
      SCHEME: EditVerse
      PROJECT: EditVerse.xcodeproj
      APP_NAME: EditVerse
      DERIVED_DATA: ${{ github.workspace }}/build/DerivedData
      IPA_DIR: ${{ github.workspace }}/build/ipa

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          if [ -d /Applications/Xcode_15.4.app ]; then
            sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer
          else
            sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          fi
          xcodebuild -version

      - name: Build unsigned iPhoneOS app
        run: |
          set -euo pipefail
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$DERIVED_DATA" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Create EditVerse.ipa
        run: |
          set -euo pipefail
          APP_PATH="$DERIVED_DATA/Build/Products/Release-iphoneos/${APP_NAME}.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "App not found at $APP_PATH"
            find "$DERIVED_DATA/Build/Products" -name "*.app" -print || true
            exit 1
          fi

          STAGE="$RUNNER_TEMP/ipa-stage"
          rm -rf "$STAGE" "$IPA_DIR"
          mkdir -p "$STAGE/Payload" "$IPA_DIR"
          cp -R "$APP_PATH" "$STAGE/Payload/${APP_NAME}.app"

          (
            cd "$STAGE"
            ditto -c -k --sequesterRsrc --keepParent Payload "$IPA_DIR/${APP_NAME}.ipa"
          )

          ls -lh "$IPA_DIR/${APP_NAME}.ipa"
          file "$IPA_DIR/${APP_NAME}.ipa"

      - name: Upload EditVerse.ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: EditVerse.ipa
          path: ${{ env.IPA_DIR }}/EditVerse.ipa
          if-no-files-found: error
          compression-level: 0
