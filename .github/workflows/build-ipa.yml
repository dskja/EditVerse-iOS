name: Build EditVerse IPA

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-14
    timeout-minutes: 45

    env:
      SCHEME: EditVerse
      PROJECT: EditVerse.xcodeproj
      APP_NAME: EditVerse
      DERIVED_DATA: ${{ github.workspace }}/build/DerivedData
      IPA_DIR: ${{ github.workspace }}/build/ipa

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          if [ -d /Applications/Xcode_15.4.app ]; then
            sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer
          else
            sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          fi
          xcodebuild -version

      - name: List schemes
        run: xcodebuild -list -project "$PROJECT"

      - name: Build unsigned for iPhoneOS
        run: |
          set -euo pipefail
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$DERIVED_DATA" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP_PATH="$DERIVED_DATA/Build/Products/Release-iphoneos/${APP_NAME}.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "App not found at $APP_PATH"
            find "$DERIVED_DATA/Build/Products" -name "*.app" -print || true
            exit 1
          fi

          mkdir -p "$IPA_DIR/Payload"
          rm -rf "$IPA_DIR/Payload/${APP_NAME}.app"
          cp -R "$APP_PATH" "$IPA_DIR/Payload/${APP_NAME}.app"

          (
            cd "$IPA_DIR"
            rm -f "${APP_NAME}-unsigned.ipa"
            zip -qr "${APP_NAME}-unsigned.ipa" Payload
          )

          ls -lh "$IPA_DIR/${APP_NAME}-unsigned.ipa"
          unzip -l "$IPA_DIR/${APP_NAME}-unsigned.ipa" | head -n 40

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: EditVerse-unsigned-ipa
          path: ${{ env.IPA_DIR }}/EditVerse-unsigned.ipa
          if-no-files-found: error

      - name: Build for iOS Simulator (optional check)
        run: |
          set -euo pipefail
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$DERIVED_DATA" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Upload simulator app
        uses: actions/upload-artifact@v4
        with:
          name: EditVerse-simulator
          path: ${{ env.DERIVED_DATA }}/Build/Products/Release-iphonesimulator/EditVerse.app
          if-no-files-found: warn
