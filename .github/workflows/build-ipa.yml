name: Build EditVerse IPA

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_signed_ipa:
        description: "Build signed IPA (requires Apple signing secrets)"
        required: false
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  build:
    name: Build iOS
    runs-on: macos-14
    timeout-minutes: 45
    env:
      SCHEME: EditVerse
      PROJECT: EditVerse.xcodeproj
      BUNDLE_ID: com.editverse.app
      DERIVED_DATA: ${{ github.workspace }}/build/DerivedData
      ARCHIVE_PATH: ${{ github.workspace }}/build/EditVerse.xcarchive
      EXPORT_PATH: ${{ github.workspace }}/build/ipa

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          if [ -d /Applications/Xcode_15.4.app ]; then
            sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer
          else
            sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          fi
          xcodebuild -version

      - name: List schemes
        run: xcodebuild -list -project "$PROJECT"

      - name: Build for iOS Simulator
        run: |
          set -euo pipefail
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$DERIVED_DATA" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Upload simulator app
        uses: actions/upload-artifact@v4
        with:
          name: EditVerse-simulator
          path: ${{ env.DERIVED_DATA }}/Build/Products/Release-iphonesimulator/EditVerse.app
          if-no-files-found: warn

      - name: Detect signing secrets
        id: signing
        run: |
          if [[ -n "${{ secrets.BUILD_CERTIFICATE_BASE64 }}" && \
                -n "${{ secrets.P12_PASSWORD }}" && \
                -n "${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}" && \
                -n "${{ secrets.KEYCHAIN_PASSWORD }}" && \
                -n "${{ secrets.APPLE_TEAM_ID }}" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Signing secrets missing — simulator build only."
          fi

      - name: Install signing assets
        if: steps.signing.outputs.available == 'true' && (github.event_name != 'workflow_dispatch' || inputs.build_signed_ipa)
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          CERTIFICATE_PATH="$RUNNER_TEMP/build_certificate.p12"
          PP_PATH="$RUNNER_TEMP/build_pp.mobileprovision"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$CERTIFICATE_PATH"
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o "$PP_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          PP_UUID=$(/usr/libexec/PlistBuddy -c "Print UUID" /dev/stdin <<< "$(security cms -D -i "$PP_PATH")")
          cp "$PP_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$PP_UUID.mobileprovision"
          echo "PROVISIONING_PROFILE_UUID=$PP_UUID" >> "$GITHUB_ENV"

      - name: Archive and export IPA
        if: steps.signing.outputs.available == 'true' && (github.event_name != 'workflow_dispatch' || inputs.build_signed_ipa)
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          EXPORT_METHOD: ${{ secrets.EXPORT_METHOD }}
        run: |
          set -euo pipefail
          mkdir -p build "$EXPORT_PATH"
          python3 -c 'import os,plistlib; m=os.environ.get("EXPORT_METHOD") or "ad-hoc"; d={"method":m,"teamID":os.environ["APPLE_TEAM_ID"],"compileBitcode":False,"signingStyle":"manual","provisioningProfiles":{os.environ["BUNDLE_ID"]:os.environ["PROVISIONING_PROFILE_UUID"]}}; open("build/ExportOptions.plist","wb").write(plistlib.dumps(d))'
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$ARCHIVE_PATH" \
            -derivedDataPath "$DERIVED_DATA" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="iPhone Distribution" \
            PROVISIONING_PROFILE="$PROVISIONING_PROFILE_UUID" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            archive
          xcodebuild -exportArchive -archivePath "$ARCHIVE_PATH" -exportOptionsPlist build/ExportOptions.plist -exportPath "$EXPORT_PATH"
          ls -la "$EXPORT_PATH"

      - name: Upload IPA
        if: steps.signing.outputs.available == 'true' && (github.event_name != 'workflow_dispatch' || inputs.build_signed_ipa)
        uses: actions/upload-artifact@v4
        with:
          name: EditVerse-ipa
          path: ${{ env.EXPORT_PATH }}/*.ipa
          if-no-files-found: error

      - name: Cleanup keychain
        if: always() && steps.signing.outputs.available == 'true'
        run: security delete-keychain "$RUNNER_TEMP/app-signing.keychain-db" || true
